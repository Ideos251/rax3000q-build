name: Build RAX3000Q (32bit) Minimal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache dl
      uses: actions/cache@v4
      with:
        path: dl
        key: dl-cache

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget

    - name: Fix permissions
      run: chmod -R +x .

    - name: Update & install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate minimal config with TPROXY
      run: |
        rm -f .config
        echo "CONFIG_TARGET_qualcommax=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_cmcc_rax3000q=y" >> .config
        echo "CONFIG_ARCH_32=y" >> .config
        echo "CONFIG_ARM=y" >> .config
        echo "# CONFIG_ARM64 is not set" >> .config
        echo "# CONFIG_64BIT is not set" >> .config
        
        # 必须编进固件的内核模块（支持 Passwall 和 OpenClash 的底层要求）
        echo "CONFIG_PACKAGE_kmod-nft-tproxy=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-core=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nf-tproxy=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nf-conntrack=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        
        # 基础工具（后面装 Passwall 时需要用到）
        echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
        echo "CONFIG_PACKAGE_ip-full=y" >> .config
        echo "CONFIG_PACKAGE_ipset=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config # 开个 OpenClash 作为赠送
        
        make defconfig

    - name: Build firmware
      run: |
        make -j4 || make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: rax3000q-base-tproxy
        path: bin/targets/
