name: Build RAX3000Q (32bit)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache dl
      uses: actions/cache@v4
      with:
        path: dl
        key: dl-cache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-RAX32
        restore-keys: ccache-

    - name: Cache host tools
      uses: actions/cache@v4
      with:
        path: build_dir/host
        key: host-tools

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget ccache

    - name: Fix permissions
      run: chmod -R +x .

    - name: Add Passwall feed
      run: |
        echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> feeds.conf.default
        echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main" >> feeds.conf.default

    - name: Update and install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate config
      run: |
        rm -f .config
        echo "CONFIG_TARGET_qualcommax=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
        echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_cmcc_rax3000q=y" >> .config
        echo "CONFIG_ARCH_32=y" >> .config
        echo "CONFIG_ARM=y" >> .config
        echo "# CONFIG_ARM64 is not set" >> .config
        echo "# CONFIG_64BIT is not set" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-tproxy=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-core=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nf-tproxy=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nf-conntrack=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
        echo "CONFIG_PACKAGE_ip-full=y" >> .config
        echo "CONFIG_PACKAGE_ipset=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
        make defconfig

    - name: Verify config
      run: |
        grep -E "CONFIG_PACKAGE_(kmod-nft-tproxy|luci-app-passwall|dnsmasq-full)=" .config || true

    - name: Build firmware
      run: |
        make -j4 || make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: rax3000q-firmware-32bit-passwall
        path: bin/targets/
